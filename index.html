// ── APIs Binance ──
async function fetchKlines(pair,interval="5m",limit=60){
  const sym=pair.replace("/","");
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);
  if(!r.ok)throw new Error("Binance "+r.status);
  return (await r.json()).map(k=>({open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
}
async function fetchTicker(pair){
  const r=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${pair.replace("/","")}`);
  if(!r.ok)throw new Error("Ticker");
  return r.json();
}

// ── Indicateurs techniques ──
function calcBollinger(closes,period=20){
  const slice=closes.slice(-period);
  const mean=slice.reduce((a,b)=>a+b,0)/period;
  const std=Math.sqrt(slice.reduce((a,b)=>a+Math.pow(b-mean,2),0)/period);
  const upper=mean+2*std, lower=mean-2*std;
  const last=closes.at(-1);
  if(last>=upper*0.999)return "UPPER";
  if(last<=lower*1.001)return "LOWER";
  return "MIDDLE";
}
function calcMACD(closes){
  const ema=(arr,p)=>{
    const k=2/(p+1);
    return arr.reduce((prev,cur,i)=>i===0?cur:prev*( 1-k)+cur*k,arr[0]);
  };
  const ema12=ema(closes.slice(-26),12);
  const ema26=ema(closes.slice(-26),26);
  const macd=ema12-ema26;
  const signal=ema(closes.slice(-9).map((_,i)=>ema(closes.slice(-26+i,-26+i+12||undefined),12)-ema(closes.slice(-26+i),26)),9);
  if(macd>signal)return "BULLISH";
  if(macd<signal)return "BEARISH";
  return "NEUTRAL";
}
function isGoodSession(){
  const h=new Date().getUTCHours();
  return (h>=7&&h<=21); // London + NY combiné
}
function calcVolatility(closes,window=20){
  const slice=closes.slice(-(window+1));
  const lr=slice.slice(1).map((c,i)=>Math.log(c/slice[i]));
  const mean=lr.reduce((a,b)=>a+b,0)/lr.length;
  return Math.sqrt(lr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/lr.length)*100;
}

// ── Analyse IA ──
async function analyzeWithAI(pair,candles,recentLosses=0){
  const closes=candles.map(c=>c.close);
  const vol=calcVolatility(closes);
  const t5=((closes.at(-1)-closes.at(-5))/closes.at(-5))*100;
  const t20=((closes.at(-1)-closes.at(-20))/closes.at(-20))*100;
  const bollinger=calcBollinger(closes);
  const macd=calcMACD(closes);
  const sessionOk=isGoodSession();
  const data={pair,price:closes.at(-1).toFixed(4),
    vol_pct:vol.toFixed(4),trend5:t5.toFixed(3),trend20:t20.toFixed(3),
    bollinger_position:bollinger,macd_direction:macd,
    session_active:sessionOk,recent_losses:recentLosses,
    high20:Math.max(...candles.slice(-20).map(c=>c.high)).toFixed(4),
    low20:Math.min(...candles.slice(-20).map(c=>c.low)).toFixed(4),
    last5closes:closes.slice(-5).map(c=>c.toFixed(4))};
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,
      system:SYSTEM_PROMPT,
      messages:[{role:"user",content:"Analyse:\n"+JSON.stringify(data,null,2)}]})
  });
  const d=await resp.json();
  const txt=d.content?.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
  return JSON.parse(txt);
}

function Spark({candles,signal,h=48}){
  if(!candles?.length)return React.createElement("div",{style:{height:h}});
  const c=candles.map(x=>x.close);
  const mn=Math.min(...c),mx=Math.max(...c),rng=mx-mn||1;
  const W=200,pts=c.map((v,i)=>`${(i/(c.length-1))*W},${h-((v-mn)/rng)*(h-4)+2}`).join(" ");
  const col=signal==="LONG"?"#00e5a0":signal==="SHORT"?"#ff4560":"#f5a623";
  return React.createElement("svg",{width:"100%",height:h,viewBox:`0 0 ${W} ${h}`,preserveAspectRatio:"none"},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:"sg"+signal,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:col,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:col,stopOpacity:"0"}))),
    React.createElement("polygon",{points:`0,${h} ${pts} ${W},${h}`,fill:`url(#sg${signal})`}),
    React.createElement("polyline",{points:pts,fill:"none",stroke:col,strokeWidth:"1.8",strokeLinejoin:"round"}));
}
