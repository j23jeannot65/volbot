<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;

const PAIRS=["BTC/USDT","ETH/USDT","BNB/USDT","SOL/USDT","XRP/USDT"];
const SYSTEM_PROMPT=`Tu es VOLBOT, expert en analyse technique crypto. Retourne UNIQUEMENT un JSON valide sans markdown ni explication.
Format STRICT:
{"signal":"LONG"|"SHORT"|"WAIT","confidence":0-100,"volatility":number,"rsi":number,"reason":"max 80 chars","sl_pct":number,"tp_pct":number}
Règles: LONG si vol élevée+RSI<38+tendance haussière. SHORT si vol élevée+RSI>62+tendance baissière. WAIT sinon.
Ne jamais inventer des données. sl_pct entre 1.0-3.0, tp_pct entre 1.5-5.0`;

// ── Storage ──
const S={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// ── Binance Public API ──
async function fetchKlines(pair,interval="5m",limit=50){
  const sym=pair.replace("/","");
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);
  if(!r.ok)throw new Error("Binance "+r.status);
  return (await r.json()).map(k=>({open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
}
async function fetchTicker(pair){
  const r=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${pair.replace("/","")}`);
  if(!r.ok)throw new Error("Ticker "+r.status);
  return r.json();
}

// ── Analyse IA ──
async function analyzeWithAI(pair,candles){
  const closes=candles.map(c=>c.close);
  const lr=closes.slice(1).map((c,i)=>Math.log(c/closes[i]));
  const mean=lr.reduce((a,b)=>a+b,0)/lr.length;
  const vol=Math.sqrt(lr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/lr.length)*100;
  const t5=((closes.at(-1)-closes.at(-5))/closes.at(-5))*100;
  const t20=((closes.at(-1)-closes.at(-20))/closes.at(-20))*100;
  const data={pair,price:closes.at(-1).toFixed(4),vol_pct:vol.toFixed(4),trend5:t5.toFixed(3),trend20:t20.toFixed(3),
    high20:Math.max(...candles.slice(-20).map(c=>c.high)).toFixed(4),
    low20:Math.min(...candles.slice(-20).map(c=>c.low)).toFixed(4),
    last5closes:closes.slice(-5).map(c=>c.toFixed(4))};
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
      system:SYSTEM_PROMPT,
      messages:[{role:"user",content:"Analyse:\n"+JSON.stringify(data,null,2)}]})
  });
  const d=await resp.json();
  const txt=d.content?.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
  return JSON.parse(txt);
}

// ── Mini Sparkline ──
function Spark({candles,signal,h=48}){
  if(!candles?.length)return React.createElement("div",{style:{height:h}});
  const c=candles.map(x=>x.close);
  const mn=Math.min(...c),mx=Math.max(...c),rng=mx-mn||1;
  const W=200,pts=c.map((v,i)=>`${(i/(c.length-1))*W},${h-((v-mn)/rng)*(h-4)+2}`).join(" ");
  const col=signal==="LONG"?"#00e5a0":signal==="SHORT"?"#ff4560":"#f5a623";
  return React.createElement("svg",{width:"100%",height:h,viewBox:`0 0 ${W} ${h}`,preserveAspectRatio:"none"},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:"sg",x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:col,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:col,stopOpacity:"0"}))),
    React.createElement("polygon",{points:`0,${h} ${pts} ${W},${h}`,fill:"url(#sg)"}),
    React.createElement("polyline",{points:pts,fill:"none",stroke:col,strokeWidth:"1.8",strokeLinejoin:"round"}));
}

// ── Badge signal ──
function Badge({signal,lg}){
  const cfg={LONG:{bg:"#00e5a015",bd:"#00e5a0",cl:"#00e5a0",lb:"▲ LONG"},
    SHORT:{bg:"#ff456015",bd:"#ff4560",cl:"#ff4560",lb:"▼ SHORT"},
    WAIT:{bg:"#ffffff08",bd:"#ffffff20",cl:"#555",lb:"— ATTENTE"}};
  const c=cfg[signal]||cfg.WAIT;
  return React.createElement("span",{style:{
    background:c.bg,border:`1px solid ${c.bd}`,color:c.cl,
    borderRadius:6,padding:lg?"5px 14px":"3px 9px",
    fontSize:lg?13:10,fontWeight:800,letterSpacing:".07em",
    fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}},c.lb);
}

// ── Toast ──
function Toast({msg,onClose}){
  useEffect(()=>{if(msg){const t=setTimeout(onClose,4000);return()=>clearTimeout(t)}},[msg]);
  if(!msg)return null;
  return React.createElement("div",{style:{
    position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",
    background:msg.type==="error"?"#ff456022":"#00e5a022",
    border:`1px solid ${msg.type==="error"?"#ff4560":"#00e5a0"}`,
    color:"#fff",borderRadius:12,padding:"12px 20px",fontSize:13,
    backdropFilter:"blur(16px)",zIndex:999,maxWidth:"88vw",textAlign:"center",
    fontWeight:500,animation:"fadeIn .3s ease"}},msg.text);
}

            ". Ne cochez jamais \"Retraits\"."))),

      // Step 2
      step===2&&React.createElement(React.Fragment,null,
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
          [["CAPITAL TOTAL (USDT)",cap,setCap],["RISQUE / TRADE (%)",risk,setRisk],

        React.createElement("div",{className:"card"},
          React.createElement("div",{style:{fontSize:13,color:"#aaa",lineHeight:1.8}},

// APP PRINCIPALE
// ════════════════════════════════════════════
function App(){
  const [config,setConfig]=useState(S.get("volbot_config",null));
  const [tab,setTab]=useState("markets");
  const [markets,setMarkets]=useState({});
  const [positions,setPositions]=useState(S.get("volbot_positions",[]));
  const [trades,setTrades]=useState(S.get("volbot_trades",[]));
  const [botOn,setBotOn]=useState(false);
  const [loading,setLoading]=useState({});
  const [toast,setToast]=useState(null);
  const [detail,setDetail]=useState(null);
  const [pnl,setPnl]=useState(S.get("volbot_pnl",0));
  const [depAddr,setDepAddr]=useState("");
  const intv=useRef(null);

  const toast2=(text,type="info")=>setToast({text,type});

  // Charger marché
  const loadPair=useCallback(async(pair)=>{
    try{
      const [k,t]=await Promise.all([fetchKlines(pair),fetchTicker(pair)]);
      setMarkets(prev=>({...prev,[pair]:{
        candles:k,price:+t.lastPrice,change:+t.priceChangePercent,
        high24:+t.highPrice,low24:+t.lowPrice,vol:+t.quoteVolume,
        signal:prev[pair]?.signal||"WAIT",analysis:prev[pair]?.analysis||null}}));
    }catch(e){console.warn(pair,e);}
  },[]);

  useEffect(()=>{PAIRS.forEach(p=>loadPair(p));},[]);

  // Boucle bot
  const runBot=useCallback(async()=>{
    if(!botOn)return;
    for(const pair of PAIRS){
      const m=markets[pair];if(!m?.candles)continue;
      const pos=positions.find(p=>p.pair===pair);
      if(pos){
        const px=m.price;
        if(pos.side==="LONG"&&px<=pos.sl)closPos(pos,px,"🛑 Stop-Loss");
        else if(pos.side==="LONG"&&px>=pos.tp)closPos(pos,px,"🎯 Take-Profit");
        else if(pos.side==="SHORT"&&px>=pos.sl)closPos(pos,px,"🛑 Stop-Loss");
        else if(pos.side==="SHORT"&&px<=pos.tp)closPos(pos,px,"🎯 Take-Profit");
        continue;
      }
      setLoading(l=>({...l,[pair]:true}));
      try{
        const res=await analyzeWithAI(pair,m.candles);
        setMarkets(prev=>({...prev,[pair]:{...prev[pair],signal:res.signal,analysis:res}}));
        if(res.signal!=="WAIT"&&res.confidence>=60)openPos(pair,res,m.price);
      }catch(e){console.warn(e);}
      finally{setLoading(l=>({...l,[pair]:false}));}
    }
  },[botOn,markets,positions]);

  useEffect(()=>{
    if(botOn){
      PAIRS.forEach(p=>loadPair(p));
      intv.current=setInterval(()=>{PAIRS.forEach(p=>loadPair(p));runBot();},30000);
      runBot();
    }else clearInterval(intv.current);
    return()=>clearInterval(intv.current);
  },[botOn]);

  useEffect(()=>{if(botOn)runBot();},[markets]);

  const openPos=(pair,analysis,price)=>{
    const amt=config.capital*(config.risk/100);
    const sl=analysis.signal==="LONG"?price*(1-analysis.sl_pct/100):price*(1+analysis.sl_pct/100);
    const tp=analysis.signal==="LONG"?price*(1+analysis.tp_pct/100):price*(1-analysis.tp_pct/100);
    const pos={id:Date.now(),pair,side:analysis.signal,entry:price,sl,tp,
      qty:amt/price,usdt:amt,confidence:analysis.confidence,reason:analysis.reason,
      time:new Date().toLocaleTimeString()};
    const updated=[...positions,pos];
    setPositions(updated);S.set("volbot_positions",updated);
    toast2(`${analysis.signal==="LONG"?"🟢":"🔴"} Position ouverte ${pair}`);
  };

  const closPos=(pos,exit,reason)=>{
    const gain=pos.side==="LONG"?(exit-pos.entry)*pos.qty:(pos.entry-exit)*pos.qty;
    const tr={...pos,exit,pnl:gain,reason,closeTime:new Date().toLocaleTimeString()};
    const np=positions.filter(p=>p.id!==pos.id);
    const nt=[tr,...trades].slice(0,50);
    const np2=pnl+gain;
    setPositions(np);setTrades(nt);setPnl(np2);
    S.set("volbot_positions",np);S.set("volbot_trades",nt);S.set("volbot_pnl",np2);
    toast2(`${gain>=0?"✅":"❌"} ${reason} ${pair} → ${gain>=0?"+":""}${gain.toFixed(3)} USDT`);
  };

  if(!config)return React.createElement(Setup,{onSave:cfg=>{S.set("volbot_config",cfg);setConfig(cfg);}});

  const wins=trades.filter(t=>t.pnl>0).length;
  const wr=trades.length?((wins/trades.length)*100).toFixed(0):0;

  // ── Écran détail ──
  if(detail){
    const m=markets[detail];
    const pos=positions.find(p=>p.pair===detail);
    const an=m?.analysis;
    const upnl=pos?(pos.side==="LONG"?(m?.price-pos.entry)*pos.qty:(pos.entry-m?.price)*pos.qty):0;
    return React.createElement("div",{className:"fade",style:{minHeight:"100vh",background:"#070a12",paddingBottom:100}},
      // Header
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:14,padding:"52px 20px 16px",
        borderBottom:"1px solid rgba(255,255,255,.06)"}},
        React.createElement("button",{onClick:()=>setDetail(null),style:{
          width:38,height:38,borderRadius:10,background:"rgba(255,255,255,.08)",
          border:"none",color:"#fff",fontSize:20,cursor:"pointer"}},
          "←"),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:20,fontWeight:800,color:"#fff"}}),detail,
          React.createElement("div",{style:{fontSize:12,color:m?.change>=0?"#00e5a0":"#ff4560"}},
            (m?.change>=0?"▲":"▼")+" "+Math.abs(m?.change||0).toFixed(2)+"% · 24h")),
        React.createElement("div",{style:{marginLeft:"auto"}},
          loading[detail]?React.createElement("div",{className:"loader"}):React.createElement(Badge,{signal:m?.signal||"WAIT",lg:true}))),
      React.createElement("div",{style:{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}},
        // Prix + chart
        React.createElement("div",{className:"card"},
          React.createElement("div",{style:{fontSize:30,fontWeight:800,color:"#fff",fontFamily:"'DM Mono',monospace"}},
            m?.price?.toLocaleString("fr-FR",{maximumFractionDigits:detail.includes("XRP")?5:2}),
            React.createElement("span",{style:{fontSize:13,color:"#555",marginLeft:6}},"USDT")),
          React.createElement("div",{style:{margin:"12px 0"}},React.createElement(Spark,{candles:m?.candles,signal:m?.signal,h:80})),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}},
            [["24h Haut",m?.high24?.toFixed(2)],["24h Bas",m?.low24?.toFixed(2)],
             ["Vol (M$)",m?.vol?(m.vol/1e6).toFixed(1):"—"]].map(([l,v])=>
              React.createElement("div",{key:l,style:{textAlign:"center"}},
                React.createElement("div",{style:{fontSize:10,color:"#555",marginBottom:2}},l),
                React.createElement("div",{style:{fontSize:13,color:"#ccc",fontFamily:"'DM Mono',monospace"}},v||"—"))))),
        // Analyse IA
        an&&React.createElement("div",{className:"card"},
          React.createElement("div",{style:{fontSize:11,color:"#555",letterSpacing:".1em",marginBottom:12}},"ANALYSE IA"),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
            [["Confiance",an.confidence+"%",an.confidence>=70?"#00e5a0":"#f5a623"],
             ["Volatilité",parseFloat(an.volatility).toFixed(3)+"%","#aaa"],
